# 候補モデルとして登録してよい最低条件。
#
# ここを編集すると、次のPipeline実行から新しい基準が適用される。
# コード変更やデプロイは要らない。基準を変えたときは、なぜ変えたかを
# コミットメッセージに残すこと。
#
# 判定に使うのは validation split である。test split はモデルを選んだ後の
# 最終確認に一度だけ使うので、選定には使わない。

split: validation

# 不良品を見つけられないモデルは、全体の正解率が高くても役に立たない。
# そのため recall と f1 を基準に置き、accuracy は基準にしない。
minimums:
  # 実際の不良のうち、どれだけを不良と判定できたか。
  recall: 0.55
  # recall と precision の釣り合い。recall だけを上げて
  # 何でも不良と言うモデルを通さないために併せて見る。
  f1: 0.65
