# リリースゲートの方針。
#
# 「見つかったもの」を決めるのは走査器で、「出してよいか」を決めるのはここ。
# 判断を1か所に集めているので、走査器を増やしても決め方は変わらない。
#
#   pnpm sec:sbom   何でできているかを lock から書き出す
#   pnpm sec:audit  それについて既知の脆弱性を問い合わせる（要ネットワーク）
#   pnpm sec:gate   走査器の報告を読み、出してよいかを決める（ネットワーク不要）

release_gate:
  # この深刻度以上で止める。critical だけを止め、high 以下は報告に留めるのは、
  # 学習環境で「毎回赤い」状態を作らないための線引きである。本番相当の環境では
  # high も止める側へ動かす。
  block:
    - critical

  # 深刻度が付いていない助言の扱い。report は報告のみ、block は停止。
  # 既定を report にしているのは、評価が付くまでに数日かかることがあり、
  # そこで止めるとゲートを迂回する習慣ができるためである。
  unknown: report

  # 受け入れる助言。必ず理由と期限を書く。期限を過ぎた行は、除外ではなく
  # 「期限切れ」として報告され、ゲートは止まる。
  exemptions: []
