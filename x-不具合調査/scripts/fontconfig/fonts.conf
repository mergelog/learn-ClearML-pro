<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  調査用の fontconfig。WSL の Chromium には和文フォントが無く、日本語が豆腐（□）で描かれる。
  利用者の Windows と同じ条件に近づけるため、Windows のメイリオと游ゴシックだけを読ませる。
  playwright.config.ts が FONTCONFIG_FILE でブラウザに渡す。システムの設定は変えない。
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir>/mnt/c/Windows/Fonts</dir>
  <selectfont>
    <rejectfont>
      <glob>/mnt/c/Windows/Fonts/*</glob>
    </rejectfont>
    <acceptfont>
      <glob>/mnt/c/Windows/Fonts/meiryo*.ttc</glob>
      <glob>/mnt/c/Windows/Fonts/YuGoth*.ttc</glob>
    </acceptfont>
  </selectfont>
  <cachedir>/tmp/claude-bug-investigation-fontcache</cachedir>
</fontconfig>
